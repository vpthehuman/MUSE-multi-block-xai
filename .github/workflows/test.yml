name: CI - tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11, 3.12]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --upgrade pip
          # install runtime deps (top-level or from requirements folder)
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f requirements/requirements.txt ]; then
            pip install -r requirements/requirements.txt
          fi
          # install dev/test deps
          if [ -f requirements/requirements-dev.txt ]; then
            pip install -r requirements/requirements-dev.txt
          elif [ -f requirements/requirements-dev.txt ]; then
            pip install -r requirements/requirements-dev.txt
          fi
          pip install -e .

      - name: Run tests
        env:
          MPLBACKEND: Agg
          PYTHONWARNINGS: default
        run: |
          pytest -q
