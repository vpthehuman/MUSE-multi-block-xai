name: JOSS draft PDF

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # Install a known recent pandoc for stable --citeproc behavior
      - name: Setup pandoc (stable)
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: "3.1.5"

      - name: Install TeX and biber (minimal)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            texlive-xetex \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-bibtex-extra \
            biber \
            lmodern \
            latexmk

      - name: Show pandoc and biber versions (diagnostic)
        run: |
          pandoc --version | head -n 1
          pandoc --version
          biber --version || true

      - name: Convert paper.md -> build/paper.tex with pandoc (force cite processing)
        run: |
          set -euo pipefail
          mkdir -p build
          echo "Running pandoc --citeproc to produce build/paper.tex"
          pandoc \
            --from=markdown \
            --to=latex \
            --standalone \
            --citeproc \
            --metadata=citation-package:biblatex \
            --bibliography=paper/paper.bib \
            paper/paper.md -o build/paper.tex

          echo "---- show whether raw \\citeproc tokens remain (lines 350-420) ----"
          sed -n '350,420p' build/paper.tex || true

          # quick check for any occurences of \citeproc in the whole file
          if grep -q -- '\\citeproc' build/paper.tex; then
            echo "WARNING: raw \\citeproc tokens still present in build/paper.tex"
            echo "Listing all lines containing \\citeproc:"
            grep -n -- '\\citeproc' build/paper.tex || true
          else
            echo "No \\citeproc tokens detected in build/paper.tex — pandoc ran successfully."
          fi

      # OPTIONAL HACK: if pandoc still left \citeproc tokens, convert them to \autocite (biblatex)
      # Use this only if you confirmed you want biblatex-style \autocite. It's a fallback hack.
      - name: Fallback: replace raw \citeproc{...} -> \autocite{...} (only if present)
        if: always()
        run: |
          set -euo pipefail
          if grep -q -- '\\citeproc' build/paper.tex; then
            echo "Performing safe fallback replacement: \\citeproc{KEY} -> \\autocite{KEY}"
            # use perl to do a robust regex replace across file
            perl -0777 -pe "s/\\\\citeproc\{([^}]*)\}/\\\\autocite\{\$1\}/g" -i.build.bak build/paper.tex
            echo "Replacement done; show replaced lines:"
            grep -n -- '\\autocite' build/paper.tex || true
          else
            echo "No replacement needed."
          fi

      - name: Compile build/paper.tex -> PDF with latexmk (lualatex + biber)
        run: |
          set -euo pipefail
          cd build
          echo "=== Running latexmk (lualatex + biber) ==="
          # Force lualatex engine so LuaHBTeX is used (matches runner environment)
          latexmk -pdf -pdflatex="lualatex %O %S" -use-make -f paper.tex || true

          if [ ! -f "paper.pdf" ]; then
            echo "latexmk failed — printing logs (paper.log, latexmk.log, any .blg) for debugging"
            test -f paper.log && sed -n '1,300p' paper.log || true
            test -f latexmk.log && sed -n '1,300p' latexmk.log || true
            for f in *.blg; do echo "---- $f ----"; sed -n '1,200p' "$f"; done || true
            echo "---- tail of paper.tex (last 120 lines) ----"
            tail -n 120 paper.tex || true
            exit 1
          fi

          # copy produced PDF to repo root for artifact upload
          cp paper.pdf ../paper.pdf
          echo "PDF produced at ./paper.pdf"

      - name: Upload PDF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joss-paper
          path: |
            ./paper.pdf
            **/*.pdf
            paper/*.pdf
            *.pdf
