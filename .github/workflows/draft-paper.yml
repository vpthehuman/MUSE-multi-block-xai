name: JOSS draft PDF

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install pandoc, texlive and biber (minimal)
        run: |
          sudo apt-get update -y
          # install pandoc (no pandoc-citeproc), latex packages and biber
          sudo apt-get install -y pandoc \
            texlive-xetex \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-bibtex-extra \
            biber \
            lmodern

      - name: Show pandoc and biber versions
        run: |
          pandoc --version | head -n 2
          pandoc --version
          biber --version || true

      - name: Convert paper.md -> paper.tex with pandoc (diagnostic)
        run: |
          mkdir -p build
          pandoc --from markdown \
                 --to latex \
                 --standalone \
                 --citeproc \
                 --metadata=citation-package:biblatex \
                 --bibliography=paper/paper.bib \
                 paper/paper.md -o build/paper.tex || true
          echo "---- snip: lines 360-420 of generated LaTeX ----"
          sed -n '360,420p' build/paper.tex || true

      - name: Build draft PDF (openjournals action)
        uses: openjournals/openjournals-draft-action@v1.0
        with:
          journal: joss
          paper-path: paper/paper.md
          args: "--bib paper/paper.bib --citeproc --metadata=citation-package:biblatex"

      - name: Upload PDF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joss-paper
          path: |
            **/*.pdf
            paper/*.pdf
            *.pdf
