name: JOSS draft PDF

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python (needed for some tools)
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # Install a stable pandoc release (reliable --citeproc)
      - name: Setup pandoc (stable)
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: "3.1.5"

      # Install TeX tooling and biber + latexmk
      - name: Install TeX (latexmk, biber, needed packages)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            texlive-xetex \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-bibtex-extra \
            biber \
            lmodern \
            latexmk

      - name: Show tool versions (diagnostic)
        run: |
          pandoc --version | head -n 1
          pandoc --version
          biber --version || true
          latexmk -v || true

      # Convert markdown -> LaTeX using pandoc with cite processing
      - name: Pandoc: convert paper.md -> build/paper.tex (with --citeproc)
        run: |
          set -euo pipefail
          mkdir -p build
          echo "Running pandoc --citeproc to generate build/paper.tex"
          pandoc \
            --from=markdown \
            --to=latex \
            --standalone \
            --citeproc \
            --metadata=citation-package:biblatex \
            --bibliography=paper/paper.bib \
            paper/paper.md -o build/paper.tex

          echo "---- Showing lines 340-420 of build/paper.tex (inspect for raw \\citeproc) ----"
          sed -n '340,420p' build/paper.tex || true

          if grep -q -- '\\citeproc' build/paper.tex; then
            echo "WARNING: raw \\citeproc tokens detected in build/paper.tex"
            echo "Listing occurrences (line numbers):"
            grep -n -- '\\citeproc' build/paper.tex || true
          else
            echo "No raw \\citeproc detected — pandoc expanded citations."
          fi

      # Fallback: if anything left with \citeproc, convert to \autocite (biblatex) to unblock compile
      - name: Fallback replace: \\citeproc{...} -> \\autocite{...} (only if present)
        if: always()
        run: |
          set -euo pipefail
          if grep -q -- '\\citeproc' build/paper.tex; then
            echo "Performing safe fallback substitution: \\citeproc{KEY} -> \\autocite{KEY}"
            perl -0777 -pe "s/\\\\citeproc\{([^}]*)\}/\\\\autocite\{\$1\}/g" -i.build.bak build/paper.tex
            echo "Replacement complete; show example lines (if any):"
            grep -n -- '\\autocite' build/paper.tex || true
          else
            echo "No fallback replacement required."
          fi

      # Compile the produced LaTeX to PDF using latexmk (lualatex + biber)
      - name: Compile build/paper.tex -> PDF (latexmk, lualatex + biber)
        run: |
          set -euo pipefail
          cd build
          echo "Running latexmk (lualatex + biber)..."
          # Use lualatex as engine (matches runner's LuaHBTeX)
          latexmk -pdf -pdflatex="lualatex %O %S" -use-make -f paper.tex || true

          if [ ! -f "paper.pdf" ]; then
            echo "latexmk failed; printing helpful logs for diagnosis:"
            test -f paper.log && sed -n '1,300p' paper.log || true
            test -f latexmk.log && sed -n '1,300p' latexmk.log || true
            for f in *.blg; do echo "---- $f ----"; sed -n '1,200p' "$f"; done || true
            echo "---- tail of paper.tex (last 120 lines) ----"
            tail -n 120 paper.tex || true
            exit 1
          fi

          # copy produced PDF to repository root (artifact upload step will pick it up)
          cp paper.pdf ../paper.pdf
          echo "PDF produced at ./paper.pdf"

      # Clean auxiliary files (optional)
      - name: Clean LaTeX auxiliary files
        if: always()
        run: |
          cd build
          latexmk -c || true

      - name: Upload PDF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joss-paper
          path: |
            ./paper.pdf
            **/*.pdf
            paper/*.pdf
            *.pdf
