name: JOSS draft PDF

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # Use r-lib action to install a stable recent pandoc
      - name: Setup pandoc (stable)
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: "3.1.5"

      - name: Install TeX, latexmk and biber
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            texlive-xetex \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-bibtex-extra \
            biber \
            lmodern \
            latexmk

      - name: Show pandoc and biber versions (diagnostic)
        run: |
          pandoc --version | head -n 1
          pandoc --version
          biber --version || true

      - name: Convert paper.md -> build/paper.tex with pandoc (force cite processing)
        run: |
          set -euo pipefail
          mkdir -p build
          echo "Running pandoc --citeproc to produce build/paper.tex"
          pandoc \
            --from=markdown \
            --to=latex \
            --standalone \
            --citeproc \
            --metadata=citation-package:biblatex \
            --bibliography=paper/paper.bib \
            paper/paper.md -o build/paper.tex

          echo "---- show lines 340-420 of generated LaTeX to inspect for raw \\citeproc tokens ----"
          sed -n '340,420p' build/paper.tex || true

          if grep -q -- '\\citeproc' build/paper.tex; then
            echo "WARNING: raw \\citeproc tokens detected in build/paper.tex"
            echo "Listing occurrences (line numbers):"
            grep -n -- '\\citeproc' build/paper.tex || true
          else
            echo "No \\citeproc tokens detected; citations were processed by pandoc."
          fi

      - name: Fallback: replace raw \citeproc{...} -> \autocite{...} (only if present)
        if: always()
        run: |
          set -euo pipefail
          if grep -q -- '\\citeproc' build/paper.tex; then
            echo "Performing fallback replacement: \\citeproc{KEY} -> \\autocite{KEY}"
            # replace all \citeproc{...} occurrences with \autocite{...}
            perl -0777 -pe "s/\\\\citeproc\{([^}]*)\}/\\\\autocite\{\$1\}/g" -i.build.bak build/paper.tex
            echo "Replacement done; showing replaced lines:"
            grep -n -- '\\autocite' build/paper.tex || true
          else
            echo "No replacement needed."
          fi

      - name: Compile build/paper.tex -> PDF with latexmk (lualatex + biber)
        run: |
          set -euo pipefail
          cd build
          echo "=== Running latexmk (lualatex + biber) ==="
          latexmk -pdf -pdflatex="lualatex %O %S" -use-make -f paper.tex || true

          if [ ! -f "paper.pdf" ]; then
            echo "latexmk failed — printing helpful logs for debugging:"
            test -f paper.log && sed -n '1,300p' paper.log || true
            test -f latexmk.log && sed -n '1,300p' latexmk.log || true
            for f in *.blg; do echo "---- $f ----"; sed -n '1,200p' "$f"; done || true
            echo "---- tail of paper.tex (last 120 lines) ----"
            tail -n 120 paper.tex || true
            exit 1
          fi

          # Copy the PDF to repo root so the Upload artifact step can find it
          cp paper.pdf ../paper.pdf
          echo "PDF produced at ./paper.pdf"

      - name: Clean auxiliary LaTeX files (optional)
        if: always()
        run: |
          cd build
          latexmk -c || true

      - name: Upload PDF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joss-paper
          path: |
            ./paper.pdf
            **/*.pdf
            paper/*.pdf
            *.pdf
