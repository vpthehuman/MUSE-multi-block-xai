name: JOSS draft PDF

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install texlive (needed for PDF)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            texlive-xetex texlive-fonts-recommended texlive-latex-extra lmodern \
            texlive-bibtex-extra texlive-biblatex biber

      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@v1.0
        with:
          journal: joss
          paper-path: paper/paper.md         # <-- correct input name and path
          args: "--bib paper/paper.bib"      # <-- pass bib via args

      # Upload any generated PDF(s) so you can download them from Actions > run > Artifacts
      - name: Upload PDF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joss-paper
          path: |
            **/*.pdf
            paper/*.pdf
            *.pdf
