name: JOSS draft PDF

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pandoc (stable) using r-lib action
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: "3.1.5"

      - name: Install texlive and biber (minimal)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            texlive-xetex \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-bibtex-extra \
            biber \
            lmodern \
            make

      - name: Show pandoc and biber versions
        run: |
          pandoc --version | head -n 2
          pandoc --version
          biber --version || true
          tlmgr --version || true

      - name: Create build dir
        run: mkdir -p build

      - name: Convert markdown -> LaTeX (diagnostic)
        run: |
          pandoc --from markdown \
                 --to latex \
                 --standalone \
                 --citeproc \
                 --metadata=citation-package:biblatex \
                 --bibliography=paper/paper.bib \
                 paper/paper.md -o build/paper.tex || true
          echo "---- snip: lines 360-420 of generated LaTeX ----"
          sed -n '360,420p' build/paper.tex || true

      - name: Build PDF with pandoc + xelatex
        run: |
          # produce final PDF using XeLaTeX and --citeproc (biber will be invoked by the latex run)
          pandoc paper/paper.md \
            --from markdown \
            --standalone \
            --citeproc \
            --metadata=citation-package:biblatex \
            --bibliography=paper/paper.bib \
            --pdf-engine=xelatex \
            -o build/joss-paper.pdf

      - name: Check generated PDF (size + ls)
        run: |
          ls -l build || true
          file build/joss-paper.pdf || true

      - name: Upload PDF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joss-paper
          path: build/joss-paper.pdf
