name: JOSS draft PDF

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install system deps (texlive)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y texlive-xetex texlive-fonts-recommended texlive-latex-extra lmodern

      - name: Install Python deps (pandoc filters)
        run: |
          python -m pip install --upgrade pip
          pip install pandocfilters pyyaml

      - name: Build JOSS draft (inara)
        uses: openjournals/inara@v1
        with:
          journal: joss
          root: .
          paper: paper/paper.md
          bib: paper/paper.bib
          out: artifacts

      - name: List artifacts folder
        run: ls -la artifacts || true

      - name: Upload PDF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joss-paper-pdf
          path: artifacts/*.pdf
