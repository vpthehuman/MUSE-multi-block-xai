name: CI - tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip, setuptools, wheel
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Show repo tree (top)
        run: |
          echo "Repo root:"
          ls -la
          echo
          echo "src/ tree:"
          ls -la src || true
          echo
          echo "src/muse_xai:"
          ls -la src/muse_xai || true

      - name: Install runtime deps if any
        run: |
          if [ -f "requirements/requirements.txt" ]; then
            pip install -r requirements/requirements.txt
          fi

      - name: Install dev deps
        run: pip install pytest

      - name: Install package (editable)
        run: |
          pip install -e .
          echo "---- pip show ----"
          pip show muse-xai || true
          pip list | sed -n '1,200p'

      - name: Verify import and MUSE symbol
        run: |
          python - <<'PY'
import importlib.util, importlib, sys, pathlib, traceback
print("Python:", sys.executable)
print("sys.path (first 10):")
for p in sys.path[:10]:
    print(" ", p)
spec = importlib.util.find_spec("muse_xai")
print("find_spec('muse_xai') ->", spec)
if not spec:
    print("ERROR: muse_xai not found. Listing src/muse_xai files:")
    p = pathlib.Path("src") / "muse_xai"
    if p.exists():
        for f in sorted(p.iterdir()):
            print(" -", f)
    else:
        print(" src/muse_xai does not exist")
    raise SystemExit(1)
try:
    m = importlib.import_module("muse_xai")
    print("Imported muse_xai from:", getattr(m,"__file__", None))
    # try symbol
    try:
        from muse_xai import MUSE
        print("MUSE imported:", MUSE)
    except Exception as e:
        print("Failed to import MUSE:", e)
        traceback.print_exc()
        raise
except Exception:
    traceback.print_exc()
    raise
PY

      - name: Run pytest
        run: pytest -q
