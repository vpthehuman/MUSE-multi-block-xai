name: CI - tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip/setuptools/wheel
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Show repo layout & packaging files
        run: |
          echo "---- repo root ----"
          ls -la
          echo
          echo "---- show pyproject.toml (if present) ----"
          if [ -f pyproject.toml ]; then sed -n '1,200p' pyproject.toml; else echo "NO pyproject.toml"; fi
          echo
          echo "---- show src/ tree ----"
          if [ -d src ]; then ls -la src || true; else echo "no src/ directory"; fi
          echo
          echo "---- show src/muse_xai files ----"
          if [ -d src/muse_xai ]; then ls -la src/muse_xai || true; else echo "no src/muse_xai"; fi
          echo
          echo "---- show src/muse_xai/__init__.py (if present) ----"
          if [ -f src/muse_xai/__init__.py ]; then sed -n '1,240p' src/muse_xai/__init__.py; else echo "NO src/muse_xai/__init__.py"; fi

      - name: Install runtime deps (if present)
        run: |
          if [ -f "requirements/requirements.txt" ]; then
            pip install -r requirements/requirements.txt
          fi

      - name: Install dev deps
        run: |
          if [ -f "requirements/requirements-dev.txt" ]; then
            pip install -r requirements/requirements-dev.txt
          else
            pip install pytest
          fi

      - name: Install package (editable)
        run: |
          pip install -e .
          echo "---- pip show (muse-xai) ----"
          pip show muse-xai || true
          echo "---- pip list (top) ----"
          pip list | sed -n '1,200p'

      - name: Quick import probe (fail fast if broken)
        run: |
          python - <<'PY'
import importlib.util, importlib, sys, traceback
print("Python:", sys.version)
print("sys.path (first entries):")
for p in sys.path[:12]:
    print("  ", p)
spec = importlib.util.find_spec("muse_xai")
print("find_spec('muse_xai') ->", spec)
if not spec:
    raise SystemExit("muse_xai not found (find_spec returned None)")
try:
    import muse_xai
    print("muse_xai imported from:", getattr(muse_xai, "__file__", None))
    try:
        from muse_xai import MUSE
        print("MUSE symbol imported:", MUSE)
    except Exception as e:
        print("Failed importing MUSE symbol:", e)
        traceback.print_exc()
        raise SystemExit("MUSE import failed")
except Exception:
    traceback.print_exc()
    raise SystemExit(1)
PY

      - name: Run pytest
        run: pytest -q
