name: CI - tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip/setuptools/wheel
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Show repo layout & packaging files
        run: |
          echo "---- repo root ----"
          ls -la
          echo
          echo "---- show pyproject.toml (if present) ----"
          if [ -f pyproject.toml ]; then sed -n '1,200p' pyproject.toml; else echo "NO pyproject.toml"; fi
          echo
          echo "---- show src/ tree ----"
          if [ -d src ]; then ls -la src || true; else echo "no src/ directory"; fi
          echo
          echo "---- show src/muse_xai files ----"
          if [ -d src/muse_xai ]; then ls -la src/muse_xai || true; else echo "no src/muse_xai"; fi
          echo
          echo "---- show src/muse_xai/__init__.py (if present) ----"
          if [ -f src/muse_xai/__init__.py ]; then sed -n '1,240p' src/muse_xai/__init__.py; else echo "NO src/muse_xai/__init__.py"; fi

      - name: Install runtime deps (if present)
        run: |
          if [ -f "requirements/requirements.txt" ]; then
            pip install -r requirements/requirements.txt
          fi

      - name: Install dev deps
        run: |
          if [ -f "requirements/requirements-dev.txt" ]; then
            pip install -r requirements/requirements-dev.txt
          else
            pip install pytest
          fi

      - name: Install package (editable)
        run: |
          pip install -e .
          echo "---- pip show (muse-xai) ----"
          pip show muse-xai || true
          echo "---- pip list (top) ----"
          pip list | sed -n '1,200p'

      - name: Create verify_import.py (safe printf)
        run: |
          printf '%s\n' "import importlib.util, importlib, sys, traceback, pathlib" > verify_import.py
          printf '%s\n' "" >> verify_import.py
          printf '%s\n' "print('Python executable:', sys.executable)" >> verify_import.py
          printf '%s\n' "print('sys.path (first 12):')" >> verify_import.py
          printf '%s\n' "for p in sys.path[:12]:" >> verify_import.py
          printf '%s\n' "    print('  ', p)" >> verify_import.py
          printf '%s\n' "" >> verify_import.py
          printf '%s\n' "spec = importlib.util.find_spec('muse_xai')" >> verify_import.py
          printf '%s\n' "print(\"find_spec('muse_xai') ->\", spec)" >> verify_import.py
          printf '%s\n' "" >> verify_import.py
          printf '%s\n' "if not spec:" >> verify_import.py
          printf '%s\n' "    print('ERROR: muse_xai not found. Listing src/muse_xai files (if any):')" >> verify_import.py
          printf '%s\n' "    p = pathlib.Path('src') / 'muse_xai'" >> verify_import.py
          printf '%s\n' "    if p.exists():" >> verify_import.py
          printf '%s\n' "        for f in sorted(p.iterdir()):" >> verify_import.py
          printf '%s\n' "            print(' -', f)" >> verify_import.py
          printf '%s\n' "    else:" >> verify_import.py
          printf '%s\n' "        print(' src/muse_xai does not exist')" >> verify_import.py
          printf '%s\n' "    raise SystemExit(1)" >> verify_import.py
          printf '%s\n' "" >> verify_import.py
          printf '%s\n' "try:" >> verify_import.py
          printf '%s\n' "    m = importlib.import_module('muse_xai')" >> verify_import.py
          printf '%s\n' "    print('Imported muse_xai from:', getattr(m, '__file__', None))" >> verify_import.py
          printf '%s\n' "    try:" >> verify_import.py
          printf '%s\n' "        from muse_xai import MUSE" >> verify_import.py
          printf '%s\n' "        print('MUSE symbol imported:', MUSE)" >> verify_import.py
          printf '%s\n' "    except Exception as e:" >> verify_import.py
          printf '%s\n' "        print('Failed importing MUSE symbol:', e)" >> verify_import.py
          printf '%s\n' "        traceback.print_exc()" >> verify_import.py
          printf '%s\n' "        raise" >> verify_import.py
          printf '%s\n' "except Exception:" >> verify_import.py
          printf '%s\n' "    traceback.print_exc()" >> verify_import.py
          printf '%s\n' "    raise" >> verify_import.py
          echo "Wrote verify_import.py:"
          sed -n '1,240p' verify_import.py

      - name: Run verify_import.py
        run: python verify_import.py

      - name: Run pytest
        run: pytest -q
