name: CI - tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip/setuptools/wheel
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Show repo layout & key files
        run: |
          echo "---- repo root ----"
          ls -la
          echo
          echo "---- pyproject.toml ----"
          if [ -f pyproject.toml ]; then sed -n '1,200p' pyproject.toml; else echo "NO pyproject.toml"; fi
          echo
          echo "---- src/muse_xai ----"
          if [ -d src/muse_xai ]; then ls -la src/muse_xai; else echo "no src/muse_xai"; fi
          echo
          if [ -f src/muse_xai/__init__.py ]; then
            echo "---- src/muse_xai/__init__.py ----"
            sed -n '1,240p' src/muse_xai/__init__.py
          else
            echo "NO src/muse_xai/__init__.py"
          fi

      - name: Install runtime deps (if present)
        run: |
          if [ -f "requirements/requirements.txt" ]; then
            pip install -r requirements/requirements.txt
          fi

      - name: Install dev deps
        run: |
          if [ -f "requirements/requirements-dev.txt" ]; then
            pip install -r requirements/requirements-dev.txt
          else
            pip install pytest
          fi

      - name: Install package (editable)
        run: |
          pip install -e .
          echo "---- pip show (muse-xai) ----"
          pip show muse-xai || true
          echo "---- pip list (top) ----"
          pip list | sed -n '1,200p'

      - name: Quick import probe (will fail job if import fails)
        run: |
          python - <<'PY'
import importlib.util, importlib, sys, traceback
print("find_spec:", importlib.util.find_spec("muse_xai"))
m = importlib.import_module("muse_xai")
print("module_file:", getattr(m, "__file__", None))
from muse_xai import MUSE
print("MUSE imported OK:", MUSE)
PY

      - name: Run pytest
        run: pytest -q
