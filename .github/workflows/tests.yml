name: CI - tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip, setuptools, wheel
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Show repo tree (top)
        run: |
          echo "Repo root files:"
          ls -la
          echo
          echo "src/ tree:"
          ls -la src || true
          echo
          echo "src/muse_xai tree:"
          ls -la src/muse_xai || true

      - name: Install runtime deps if any
        run: |
          if [ -f "requirements/requirements.txt" ]; then
            pip install -r requirements/requirements.txt
          fi

      - name: Install dev deps
        run: |
          pip install pytest

      - name: Install package (editable) and show result
        run: |
          pip install -e .
          echo
          echo "---- pip show muse-xai ----"
          pip show muse-xai || pip show muse-xai-0.1.0 || true
          echo
          echo "---- pip list top 200 ----"
          pip list | sed -n '1,200p'

      - name: Python import probe (will fail job if import fails)
        run: |
          python - <<'PY'
import importlib, importlib.util, sys, traceback, pathlib
print("Python executable:", sys.executable)
print("sys.path (first 10):")
for p in sys.path[:10]:
    print("  ", p)
print("\nFinding spec for muse_xai...")
spec = importlib.util.find_spec("muse_xai")
print("spec:", spec)
if not spec:
    print("\nERROR: muse_xai not found by find_spec(). Listing src/muse_xai files:")
    p = pathlib.Path("src") / "muse_xai"
    if p.exists():
        for x in sorted(p.iterdir()):
            print(" -", x.name)
    else:
        print(" src/muse_xai does not exist!")
    raise SystemExit("muse_xai not installed/importable")

try:
    m = importlib.import_module("muse_xai")
    print("Imported muse_xai:", getattr(m, "__file__", None))
    # try to import MUSE from package
    try:
        from muse_xai import MUSE
        print("Successfully imported MUSE:", MUSE)
    except Exception as e:
        print("Failed to import MUSE from muse_xai:", e)
        traceback.print_exc()
        raise
except Exception:
    traceback.print_exc()
    raise
PY

      - name: Run pytest
        run: pytest -q
